version: '3.8'

services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: agrisathi-backend-prod
    restart: always
    environment:
      - PORT=5000
      - NODE_ENV=production
      - CORS_ORIGIN=https://agrisathi.ai
      - JWT_SECRET=${JWT_SECRET}
    networks:
      - agrisathi-prod-net

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: agrisathi-frontend-prod
    restart: always
    networks:
      - agrisathi-prod-net

  nginx:
    image: nginx:alpine
    container_name: agrisathi-nginx-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    networks:
      - agrisathi-prod-net

networks:
  agrisathi-prod-net:
    driver: bridge

