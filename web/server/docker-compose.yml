version: '3.8'

services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: agrisathi-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=development
      - CORS_ORIGIN=http://localhost:3000
      - JWT_SECRET=development_secret_key_change_in_prod
    networks:
      - agrisathi-network

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: agrisathi-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://localhost:5000/api
    depends_on:
      - backend
    networks:
      - agrisathi-network

  nginx:
    image: nginx:alpine
    container_name: agrisathi-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - agrisathi-network

networks:
  agrisathi-network:
    driver: bridge

