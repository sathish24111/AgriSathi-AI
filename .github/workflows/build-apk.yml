name: Build & Publish Android APK to Web

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build Android Debug APK
      run: |
        if [ -d "../agrisathi-ai" ]; then
          cd ../agrisathi-ai
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../agrisathi-web/client/public/download/AgriSathi-AI-v1.0.apk
        fi

    - name: Auto-Commit & Deploy to Web Public Directory
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add client/public/download/AgriSathi-AI-v1.0.apk || true
        git commit -m "Automated build: Update latest AgriSathi AI Android APK" || true
        git push || true
