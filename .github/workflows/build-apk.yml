name: Build & Publish Android APK to Web

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Android Debug APK
      run: ./gradlew assembleDebug

    - name: Copy APK to web public directory
      run: |
        mkdir -p web/frontend/public/download
        cp app/build/outputs/apk/debug/app-debug.apk web/frontend/public/download/AgriSathi-AI-v1.0.apk

    - name: Auto-Commit & Push APK
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add web/frontend/public/download/AgriSathi-AI-v1.0.apk || true
        git commit -m "ci: update latest AgriSathi AI Android APK [skip ci]" || true
        git push || true
